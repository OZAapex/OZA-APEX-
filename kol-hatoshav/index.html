function admin(){if(state.mode==='live'&&state.staffProfile?.role!=='superadmin')return `<main class="page-wrap"><div class="container"><div class="card" style="text-align:center">${ico('lock',35)}<h2>${t('staffLogin')}</h2><p>${t('adminSecurity')}</p><a href="/api/admin/municipalities" class="btn btn-primary">${t('openLogin')}</a></div></div></main>`;return `<main class="page-wrap"><div class="container">${pageHead(t('adminTitle'),t('adminSubtitle'))}<div class="admin-tiles"><section class="card"><div class="toolbar"><h2 style="margin:0">${t('adminOrgs')} <span class="pill">${state.orgs.length}</span></h2><button class="btn btn-primary btn-sm" data-action="modal-org">${ico('plus')}${t('addOrg')}</button></div>${state.orgs.map(o=>`<div class="entity-item"><div><strong>${escapeHtml(orgName(o))}</strong><br/><small class="ltr">${escapeHtml(o.slug)}</small></div><span class="pill">${escapeHtml(o.id)}</span></div>`).join('')}</section><section class="card"><div class="toolbar"><h2 style="margin:0">${t('adminStaff')} <span class="pill">${state.members.length}</span></h2><button class="btn btn-primary btn-sm" data-action="modal-member">${ico('plus')}${t('addStaff')}</button></div>${state.members.length?state.members.map(m=>`<div class="entity-item"><div><strong>${escapeHtml(m.email)}</strong><br/><small>${escapeHtml(m.role)}</small></div><span class="pill">${escapeHtml(m.municipality_id)}</span></div>`).join(''):`<p class="muted small">${t('staffDemoNote')}</p>`}</section></div><div class="notice mt25">${ico('shield')}<span>${t('adminSecurity')}</span></div></div>${state.modal?renderModal():''}</main>`}
function help(){return `<main class="page-wrap"><div class="container">${pageHead(t('aboutTitle'),t('aboutSubtitle'))}<div class="faq">${[1,2,3,4].map(i=>`<div class="faq-item"><h3>${t('faq'+i)}</h3><p>${t('faq'+i+'a')}</p></div>`).join('')}</div><div class="inline-actions mt25"><button class="btn btn-primary" data-action="nav" data-page="report">${t('newReport')}</button><button class="btn btn-outline" data-action="nav" data-page="privacy">${t('navPrivacy')}</button></div></div></main>`}
function privacy(){return `<main class="page-wrap"><div class="container"><div class="privacy-content card">${pageHead(t('privacyPageTitle'),t('privacyPageSubtitle'))}<div class="notice warning">${ico('info')}<span>${t('demo')}</span></div>${[1,2,3,4].map((i)=>`<p>${t('privacyP'+i)}</p>`).join('')}<div class="inline-actions mt25"><button class="btn btn-outline" data-action="nav" data-page="home">${t('backHome')}</button></div></div></div></main>`}
function renderModal(){let r=allReports().find(r=>r.id===state.caseId);if(state.modal==='case'&&r)return `<div class="modal-backdrop" data-action="close-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${t('staffDetails')}"><div class="modal-head"><h2>${t('staffDetails')} — <span class="ltr">${escapeHtml(r.id)}</span></h2><button class="icon-btn" data-action="close-modal" aria-label="Close">${ico('close')}</button></div><div class="notice">${ico('shield')}<span>${t('identityHidden')}</span></div><div class="detail-grid mt18"><div class="detail-cell"><small>${t('selectCategory')}</small><b>${catName(r.category)}</b></div><div class="detail-cell"><small>${t('reportStatus')}</small>${statusChip(r.status)}</div><div class="detail-cell"><small>${t('location')}</small><b>${escapeHtml(r.location)}</b></div><div class="detail-cell"><small>${t('tableDate')}</small><b>${dateText(r.created_at)}</b></div></div><div class="detail-cell" style="margin-bottom:16px"><small>${t('description')}</small><b>${escapeHtml(r.description)}</b></div>${r.photo?`<img src="${escapeHtml(r.photo)}" alt="Attached issue photo" style="max-width:100%;max-height:200px;border-radius:10px;margin-bottom:15px"/>`:''}<form id="status-form"><div class="form-grid"><div class="form-field"><label>${t('updateStatus')}</label><select name="status">${statuses.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${statusName(s)}</option>`).join('')}</select></div><div class="form-field"><label>${t('assignedDepartment')}</label><select name="assigned_department">${Object.keys(categories).map(c=>`<option value="${c}" ${c===(r.assigned_department||r.category)?'selected':''}>${catName(c)}</option>`).join('')}</select></div></div><div class="form-field"><label>${t('priority')}</label><select name="priority"><option value="normal" ${r.priority!=='high'?'selected':''}>${t('normalPriority')}</option><option value="high" ${r.priority==='high'?'selected':''}>${t('highPriority')}</option></select></div><div class="form-field"><label>${t('note')}</label><textarea name="note" maxlength="350" placeholder="${t('notePlaceholder')}"></textarea></div><div class="inline-actions"><button class="btn btn-primary" type="submit">${ico('check')}${t('saveChanges')}</button><button class="btn btn-outline" type="button" data-action="close-modal">${t('back')}</button></div></form></section></div>`;
if(state.modal==='org')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${t('addOrg')}</h2><button class="icon-btn" data-action="close-modal">${ico('close')}</button></div><form id="org-form"><div class="form-field"><label>${t('orgName')} *</label><input name="name_he" required maxlength="100"/></div><div class="form-field"><label>${t('orgNameAr')} *</label><input name="name_ar" required maxlength="100"/></div><div class="form-field"><label>${t('orgSlug')} *</label><input name="slug" dir="ltr" required pattern="[a-z0-9-]{3,45}" placeholder="my-council"/></div><button type="submit" class="btn btn-primary">${t('create')}</button></form></section></div>`;
if(state.modal==='member')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${t('addStaff')}</h2><button class="icon-btn" data-action="close-modal">${ico('close')}</button></div><form id="member-form"><div class="form-field"><label>${t('staffEmail')}</label><input name="email" type="email" required/></div><div class="form-field"><label>${t('municipality')}</label><select name="municipality_id">${state.orgs.map(o=>`<option value="${escapeHtml(o.id)}">${escapeHtml(orgName(o))}</option>`).join('')}</select></div><div class="form-field"><label>${t('role')}</label><select name="role"><option value="staff">${t('roleStaff')}</option><option value="municipal_manager">${t('roleManager')}</option></select></div><button type="submit" class="btn btn-primary">${t('create')}</button></form></section></div>`;return ''}
function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='en'?'ltr':'rtl';document.title='קול התושב | KOL HATOSHAV';document.getElementById('app').innerHTML=header()+({home,report,track,staff,admin,help,privacy}[state.page]||home)()+footer();if(state.mode==='live'&&state.page==='report'&&state.formStep===3)queueMicrotask(mountCaptcha);}
function mountCaptcha(){const el=document.getElementById('turnstile-slot');if(!el||!state.apiConfig?.site_key||!window.turnstile?.render)return;try{window.turnstile.render(el,{sitekey:state.apiConfig.site_key,theme:'light'});}catch{}}

const setPage=p=>{state.page=p;state.menu=false;state.modal=null;if(p!=='report')state.receipt=null;location.hash=p;window.scrollTo({top:0,behavior:'instant'});render()};
const validateStep=()=>{let f=state.form;if(state.formStep===0&&!f.category)return false;if(state.formStep===1&&(!f.municipality_id||!f.location.trim()||f.location.trim().length<4))return false;if(state.formStep===2&&(!f.description.trim()||f.description.trim().length<12))return false;return true};
async function submitReport(btn){let f=state.form;if(!f.category||!f.municipality_id||f.location.trim().length<4||f.description.trim().length<12){showToast(t('errorMissing'));return}btn.disabled=true;try{let r;if(state.mode==='live'){if(f.photo&&!state.apiConfig?.photo_enabled)throw Error('Photo uploads are not enabled. Remove the photo before sending.');let body={municipality_id:f.municipality_id,category:f.category,location:f.location.trim(),description:f.description.trim(),turnstile_token:window.turnstile?.getResponse?.()||'',photo:f.photo||null};const resp=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});r=await resp.json();if(!resp.ok)throw Error(r.error||t('networkError'));}else{const short=Array.from(crypto.getRandomValues(new Uint8Array(3))).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();r={id:`KTH-${new Date().getFullYear()}-${short}`,secret:rand(24),municipality_id:f.municipality_id,category:f.category,assigned_department:f.category,priority:'normal',location:f.location.trim(),description:f.description.trim(),photo:f.photo,status:'open',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),history:[{status:'open',date:new Date().toISOString(),note:''}]};state.reports.unshift(r);persist()}state.receipt={id:r.id,secret:r.secret};state.trackResult=null;state.formStep=0;state.form={municipality_id:state.orgs[0]?.id||'',category:'',location:'',description:'',photo:null};render();scrollTo(0,0)}catch(e){showToast(e.message||t('networkError'));btn.disabled=false;}}
async function processImage(file){if(!file)return;if(file.size>4*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){showToast(t('invalidPhoto'));return}try{const bitmap=await createImageBitmap(file);const factor=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*factor));canvas.height=Math.max(1,Math.round(bitmap.height*factor));const context=canvas.getContext('2d');context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const encoded=canvas.toDataURL('image/jpeg',.7);if(encoded.length>900000){showToast(t('invalidPhoto'));return}state.form.photo=encoded;showToast(t('photoSaved'));render()}catch{showToast(t('invalidPhoto'))}}
async function trackCase(form){const id=form.get('trackId')?.trim().toUpperCase(),secret=form.get('trackSecret')?.trim();state.trackResult=null;state.trackError=false;if(!id||!secret)return;try{if(state.mode==='live'){const r=await fetch(`/api/track/${encodeURIComponent(id)}`,{headers:{'X-Tracking-Key':secret}});if(!r.ok)throw Error('not found');state.trackResult=await r.json()}else{const r=state.reports.find(x=>x.id===id&&x.secret===secret);if(!r)throw Error('not found');state.trackResult=r}}catch{state.trackError=true}render()}
async function updateCase(form){const r=allReports().find(x=>x.id===state.caseId);if(!r)return;const status=form.get('status'),note=String(form.get('note')||'').trim(),assigned_department=String(form.get('assigned_department')||r.assigned_department||r.category),priority=String(form.get('priority')||r.priority||'normal');if(!statuses.includes(status)||!categories[assigned_department]||!['normal','high'].includes(priority))return;try{if(state.mode==='live'){const res=await fetch('/api/staff/reports/'+encodeURIComponent(r.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,note,assigned_department,priority})});if(!res.ok)throw Error('Not authorized');await loadStaff();}else{r.status=status;r.assigned_department=assigned_department;r.priority=priority;r.updated_at=new Date().toISOString();r.history=r.history||[];r.history.push({status,date:r.updated_at,note});persist()}state.modal=null;render();showToast(t('updated'))}catch(e){showToast(e.message||t('networkError'))}}
async function submitOrg(form){let fields=Object.fromEntries(form.entries());fields.slug=fields.slug.trim();try{if(state.mode==='live'){const r=await fetch('/api/admin/municipalities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});if(!r.ok)throw Error('Not authorized');const a=await fetch('/api/municipalities');state.orgs=await a.json();}else{if(state.orgs.some(o=>o.slug===fields.slug))throw Error('Slug already exists');state.orgs.push({id:'demo-'+rand(4),...fields,name_en:fields.name_he});persist()}state.modal=null;render();showToast(t('added'))}catch(e){showToast(e.message)}}
async function submitMember(form){const fields=Object.fromEntries(form.entries());try{if(state.mode==='live'){const r=await fetch('/api/admin/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});if(!r.ok)throw Error('Not authorized')}else{state.members.push(fields);persist()}state.modal=null;render();showToast(t('added'))}catch(e){showToast(e.message)}}
async function loadStaff(){if(state.mode!=='live')return;try{let res=await fetch('/api/staff/me');if(!res.ok)return;state.staffProfile=await res.json();res=await fetch('/api/staff/reports');if(res.ok){const d=await res.json();state.liveReports=d.reports||[]}}catch{}}
async function initialize(){try{if(location.protocol!=='file:'){const r=await fetch('/api/config',{headers:{Accept:'application/json'},cache:'no-store'});if(r.ok&&r.headers.get('content-type')?.includes('application/json')){const cfg=await r.json();if(cfg.mode==='live'){state.mode='live';state.apiConfig=cfg;state.orgs=cfg.municipalities||[];state.form.municipality_id=state.orgs[0]?.id||'';const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.defer=true;script.onload=mountCaptcha;document.head.appendChild(script);await loadStaff();}}}}catch{}render()}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1).split('?')[0]||'home';if(['home','report','track','staff','admin','privacy','help'].includes(p)&&p!==state.page){state.page=p;state.menu=false;state.modal=null;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action; if(a==='nav'){e.preventDefault();setPage(el.dataset.page);return}if(a==='language'){state.lang=el.dataset.lang;localStorage.setItem('kth_lang',JSON.stringify(state.lang));render();return}if(a==='menu'){state.menu=!state.menu;render();return}if(a==='category'){state.form.category=el.dataset.value;render();return}if(a==='next-step'){if(!validateStep())return showToast(t('errorMissing'));state.formStep++;render();return}if(a==='prev-step'){state.formStep=Math.max(0,state.formStep-1);render();return}if(a==='submit-report'){submitReport(el);return}if(a==='copy-receipt'){const r=state.receipt;if(r){const v=`${t('reportNumber')}: ${r.id}\n${t('privateKey')}: ${r.secret}`;navigator.clipboard?.writeText?.(v)?.then(()=>showToast(t('copyDone')))?.catch(()=>showToast(t('tryAgain')))||showToast(t('tryAgain'))}return}if(a==='track-receipt'){state.page='track';location.hash='track';render();return}if(a==='another-report'){state.receipt=null;state.formStep=0;render();return}if(a==='staff-view'){state.staffView=el.dataset.view;render();return}if(a==='case'){state.caseId=el.dataset.id;state.modal='case';render();return}if(a==='close-modal'){state.modal=null;render();return}if(a==='close-backdrop'&&e.target===el){state.modal=null;render();return}if(a==='modal-org'){state.modal='org';render();return}if(a==='modal-member'){state.modal='member';render();return}});
document.addEventListener('input',e=>{const node=e.target;if(state.page==='report'&&node.name&&['location','description'].includes(node.name))state.form[node.name]=node.value});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='form-municipality'){state.form.municipality_id=el.value}else if(el.id==='form-image'){processImage(el.files?.[0])}else if(el.id==='staff-org'){state.staffOrg=el.value;render()}else if(el.id==='filter-status'){state.staffFilter=el.value;render()}else if(el.id==='filter-category'){state.staffCategory=el.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();let id=e.target.id;const data=new FormData(e.target);if(id==='track-form')trackCase(data);else if(id==='status-form')updateCase(data);else if(id==='org-form')submitOrg(data);else if(id==='member-form')submitMember(data);else if(id==='filter-form'){state.staffSearch=String(data.get('q')||'').trim();render()}});
initialize();
})();

</script>
</body>
</html>
